# EXAMPLE ONLY — placeholder value, safe to commit. Never commit a real token.
#
# When this Secret exists, every /v1/* request must carry
#   Authorization: Bearer <token>
# The deployments reference it with `optional: true`, so the service also runs
# open (no auth) inside a trusted network if you never create the Secret.
#
# Create the real one directly, keeping the token out of files and shell
# history where practical:
#   kubectl -n redacta create secret generic redacta-gateway-token \
#     --from-literal=REDACTA_API_TOKEN="$(openssl rand -hex 32)"
#
# A Kubernetes Secret is base64-encoded at rest in etcd, not encrypted by
# default — enable encryption at rest / an external secret store for
# production use.
apiVersion: v1
kind: Secret
metadata:
  name: redacta-gateway-token
  namespace: redacta
  labels:
    app.kubernetes.io/part-of: redacta
type: Opaque
stringData:
  REDACTA_API_TOKEN: "REPLACE_WITH_A_LONG_RANDOM_TOKEN"
