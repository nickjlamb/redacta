# The multi-replica Redacta deployment: STATELESS endpoints only.
#
# /v1/redact, /v1/reinstate, /v1/guard, /v1/self-check are complete in a
# single request — the token map travels to/from the trusted caller — so any
# number of replicas is safe behind one Service. REDACTA_SESSIONS is
# deliberately NOT set here: the session endpoints hold mappings in one
# pod's memory and would fail intermittently behind a load balancer. They are
# served by the single-replica boundary deployment instead (boundary.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redacta-gateway
  namespace: redacta
  labels:
    app.kubernetes.io/name: redacta-gateway
    app.kubernetes.io/part-of: redacta
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: redacta-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never drop below the desired replica count during an update: bring
      # one new pod up (maxSurge), wait for its readiness probe, then retire
      # an old one. Zero-downtime as long as probes are honest.
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redacta-gateway
        app.kubernetes.io/part-of: redacta
    spec:
      # SIGTERM is sent first; the process flips /readyz to 503 and drains.
      # SIGKILL follows only after this many seconds.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          # For the local kind demo this image is built and loaded by hand
          # (see k8s/README.md). In a real cluster, point at your registry.
          image: redacta-gateway:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: redacta-gateway-config
          env:
            - name: REDACTA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: redacta-gateway-token
                  key: REDACTA_API_TOKEN
                  # Runs open (no auth) when the Secret doesn't exist.
                  optional: true
          # Liveness: "is the process alive?" — failure RESTARTS the container.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          # Readiness: "should traffic be routed here?" — failure removes the
          # pod from Service endpoints WITHOUT restarting it. This service has
          # no dependencies to wait on, so readiness mostly matters at startup
          # and during shutdown draining.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 2
          # Conservative example values — a Node process redacting text is
          # cheap. Requests are what the scheduler reserves; limits are where
          # the kernel throttles CPU or OOM-kills on memory. Measure your own
          # workload before trusting these in production.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
