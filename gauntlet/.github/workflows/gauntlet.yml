name: Redacta Gauntlet

on:
  push:
  pull_request:

jobs:
  gauntlet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      # Deterministic suite: no API key, no network. Fails the build on any
      # metric worse than results/baseline.json.
      - run: npm run gate
