name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    name: engine (npm-package)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: npm-package } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: npm-package/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm test

  mcp-server:
    name: privacy boundary (mcp-server)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mcp-server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: mcp-server/package-lock.json }
      - run: npm ci
      - name: Guard publish metadata (provenance needs repository.url)
        run: node -e "const p=require('./package.json'); if(!p.repository||!p.repository.url){console.error('package.json missing repository.url - npm provenance will reject the publish');process.exit(1)}"
      - run: npm run build
      - run: npm test

  gateway-service:
    name: gateway service (http boundary)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: gateway-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: gateway-service/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Build the production image so a broken Dockerfile fails CI.
      # Publishing is deferred until there is a registry to publish to.
      - run: docker build -t redacta-gateway:ci .
      - name: Smoke-test the image (health + a real redaction)
        run: |
          docker run -d --name rg -p 8080:8080 --read-only redacta-gateway:ci
          for i in $(seq 20); do curl -sf localhost:8080/healthz && break; sleep 1; done
          curl -sf -X POST localhost:8080/v1/redact \
            -H 'content-type: application/json' \
            -d '{"text":"NHS Number: 943 476 5919"}' | grep -q NHS_NUMBER_1
          docker rm -f rg

  python:
    name: python mirror + skill scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install ./python-package
      - run: python3 python-package/tests/test_redacta.py
      - run: python3 python-package/tests/test_gateway.py
      - run: python3 scripts/test_redact_structured.py
      - run: python3 scripts/test_reinstate.py
